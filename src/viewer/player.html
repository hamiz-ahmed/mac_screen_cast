<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mac Screencast — Movie</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }
    #msg {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #000;
      color: #ccc;
      font-family: -apple-system, Roboto, sans-serif;
      font-size: 3.5vh;
      text-align: center;
      padding: 0 8vw;
    }
    #msg.show { display: flex; }
  </style>
</head>
<body>
  <video id="movie" src="/media" controls autoplay></video>
  <div id="msg"></div>
  <script src="player.js"></script>
</body>
</html>
