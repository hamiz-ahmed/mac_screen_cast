<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mac Screencast</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #000;
      color: #ccc;
      font-family: -apple-system, Roboto, sans-serif;
      font-size: 4vh;
      text-align: center;
      transition: opacity 0.4s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .pulse {
      width: 5vh;
      height: 5vh;
      border-radius: 50%;
      background: #ff8b3d;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.7); opacity: 0.5; }
      50% { transform: scale(1); opacity: 1; }
    }
    #soundHint {
      position: fixed;
      bottom: 4vh;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #eee;
      font-family: -apple-system, Roboto, sans-serif;
      font-size: 2.6vh;
      padding: 1.2vh 2.4vh;
      border-radius: 1.2vh;
      display: none;
    }
    #soundHint.show { display: block; }
  </style>
</head>
<body>
  <video id="screen" autoplay muted playsinline></video>
  <div id="soundHint">🔇 Press any button on the remote for sound</div>
  <div id="overlay">
    <div class="pulse"></div>
    <div id="overlayText">Connecting…</div>
  </div>
  <script src="view.js"></script>
</body>
</html>
